<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img">
  <title>Step: Keep motors and speaker</title>
  <rect width="400" height="280" fill="transparent"/>
  <rect x="40" y="50" width="320" height="200" rx="8" fill="#143552" stroke="#3dbeb0" stroke-width="1.5"/>
  <text x="200" y="80" text-anchor="middle" fill="#a8e6df" font-family="Figtree,sans-serif" font-size="13" font-weight="600">Keep these - bypass the PCB</text>
  <!-- Speaker -->
  <circle cx="100" cy="160" r="35" fill="#06101c" stroke="#e8dcc8" stroke-width="2"/>
  <circle cx="100" cy="160" r="18" fill="#143552" stroke="#9bb0c4"/>
  <text x="100" y="220" text-anchor="middle" fill="#e8dcc8" font-family="Figtree,sans-serif" font-size="11">Speaker</text>
  <!-- Motors -->
  <rect x="170" y="130" width="70" height="45" rx="4" fill="#e76f51"/>
  <text x="205" y="157" text-anchor="middle" fill="#06101c" font-family="Figtree,sans-serif" font-size="11" font-weight="700">Mouth</text>
  <text x="205" y="220" text-anchor="middle" fill="#f08468" font-family="Figtree,sans-serif" font-size="11">Motor</text>
  <rect x="270" y="130" width="70" height="45" rx="4" fill="#e76f51"/>
  <text x="305" y="157" text-anchor="middle" fill="#06101c" font-family="Figtree,sans-serif" font-size="11" font-weight="700">Tail</text>
  <text x="305" y="220" text-anchor="middle" fill="#f08468" font-family="Figtree,sans-serif" font-size="11">Motor</text>
  <!-- X on PCB -->
  <rect x="160" y="90" width="100" height="25" rx="3" fill="#06101c" stroke="#9bb0c4" opacity="0.5"/>
  <path d="M175 95 L245 110 M245 95 L175 110" stroke="#e76f51" stroke-width="2"/>
  <text x="210" y="85" text-anchor="middle" fill="#e76f51" font-family="Figtree,sans-serif" font-size="10">Remove old PCB</text>
</svg>
