<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title">
  <title id="title">SomethingFishy system overview</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9bb0c4"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#0c2138" rx="4"/>
  <!-- Mic -->
  <rect x="40" y="150" width="120" height="80" rx="6" fill="#143552" stroke="#3dbeb0" stroke-width="2"/>
  <text x="100" y="185" text-anchor="middle" fill="#a8e6df" font-family="Figtree,sans-serif" font-size="14" font-weight="600">INMP441</text>
  <text x="100" y="205" text-anchor="middle" fill="#9bb0c4" font-family="Figtree,sans-serif" font-size="11">Mic</text>
  <!-- ESP32 -->
  <rect x="280" y="120" width="160" height="140" rx="6" fill="#143552" stroke="#e8dcc8" stroke-width="2"/>
  <text x="360" y="175" text-anchor="middle" fill="#eef4f8" font-family="Bricolage Grotesque,sans-serif" font-size="18" font-weight="700">ESP32-S3</text>
  <text x="360" y="200" text-anchor="middle" fill="#9bb0c4" font-family="Figtree,sans-serif" font-size="12">WiFi · I²S · GPIO</text>
  <text x="360" y="220" text-anchor="middle" fill="#3dbeb0" font-family="Figtree,sans-serif" font-size="11">OpenAI client</text>
  <!-- Amp -->
  <rect x="560" y="60" width="140" height="80" rx="6" fill="#143552" stroke="#3dbeb0" stroke-width="2"/>
  <text x="630" y="95" text-anchor="middle" fill="#a8e6df" font-family="Figtree,sans-serif" font-size="14" font-weight="600">MAX98357A</text>
  <text x="630" y="115" text-anchor="middle" fill="#9bb0c4" font-family="Figtree,sans-serif" font-size="11">Amp ’ Speaker</text>
  <!-- Motors -->
  <rect x="560" y="240" width="140" height="100" rx="6" fill="#143552" stroke="#e76f51" stroke-width="2"/>
  <text x="630" y="280" text-anchor="middle" fill="#f08468" font-family="Figtree,sans-serif" font-size="14" font-weight="600">L298N</text>
  <text x="630" y="300" text-anchor="middle" fill="#9bb0c4" font-family="Figtree,sans-serif" font-size="11">Mouth + Tail</text>
  <!-- Cloud -->
  <rect x="280" y="20" width="160" height="50" rx="25" fill="#06101c" stroke="#3dbeb0" stroke-width="1.5"/>
  <text x="360" y="50" text-anchor="middle" fill="#a8e6df" font-family="Figtree,sans-serif" font-size="13">OpenAI API</text>
  <!-- Lines -->
  <line x1="160" y1="190" x2="280" y2="190" stroke="#3dbeb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="160" x2="560" y2="100" stroke="#3dbeb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="220" x2="560" y2="290" stroke="#e76f51" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="120" x2="360" y2="70" stroke="#e8dcc8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="175" fill="#9bb0c4" font-family="Figtree,sans-serif" font-size="10">I²S in</text>
  <text x="480" y="115" fill="#9bb0c4" font-family="Figtree,sans-serif" font-size="10">I²S out</text>
  <text x="480" y="250" fill="#9bb0c4" font-family="Figtree,sans-serif" font-size="10">GPIO</text>
</svg>
