<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img">
  <title>L298N motor driver wiring</title>
  <rect width="780" height="400" fill="#0c2138" rx="4"/>
  <rect x="40" y="80" width="200" height="240" rx="8" fill="#143552" stroke="#e8dcc8" stroke-width="2"/>
  <text x="140" y="110" text-anchor="middle" fill="#eef4f8" font-family="Bricolage Grotesque,sans-serif" font-size="16" font-weight="700">ESP32-S3</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#eef4f8">
    <circle cx="220" cy="150" r="5" fill="#e76f51"/><text x="60" y="154">GPIO16 IN1</text>
    <circle cx="220" cy="180" r="5" fill="#e76f51"/><text x="60" y="184">GPIO17 IN2</text>
    <circle cx="220" cy="220" r="5" fill="#f08468"/><text x="60" y="224">GPIO4  IN3</text>
    <circle cx="220" cy="250" r="5" fill="#f08468"/><text x="60" y="254">GPIO5  IN4</text>
    <circle cx="220" cy="290" r="5" fill="#666"/><text x="60" y="294">GND</text>
  </g>
  <rect x="320" y="60" width="200" height="280" rx="8" fill="#143552" stroke="#e76f51" stroke-width="2"/>
  <text x="420" y="90" text-anchor="middle" fill="#f08468" font-family="Figtree,sans-serif" font-size="15" font-weight="700">L298N</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#eef4f8">
    <circle cx="340" cy="150" r="5" fill="#e76f51"/><text x="355" y="154">IN1</text>
    <circle cx="340" cy="180" r="5" fill="#e76f51"/><text x="355" y="184">IN2</text>
    <circle cx="340" cy="220" r="5" fill="#f08468"/><text x="355" y="224">IN3</text>
    <circle cx="340" cy="250" r="5" fill="#f08468"/><text x="355" y="254">IN4</text>
    <circle cx="340" cy="290" r="5" fill="#666"/><text x="355" y="294">GND</text>
    <circle cx="500" cy="150" r="5" fill="#e76f51"/><text x="430" y="140" font-size="10">OUT1</text>
    <circle cx="500" cy="180" r="5" fill="#e76f51"/><text x="430" y="170" font-size="10">OUT2</text>
    <circle cx="500" cy="220" r="5" fill="#f08468"/><text x="430" y="210" font-size="10">OUT3</text>
    <circle cx="500" cy="250" r="5" fill="#f08468"/><text x="430" y="240" font-size="10">OUT4</text>
  </g>
  <rect x="580" y="100" width="160" height="80" rx="8" fill="#143552" stroke="#e76f51" stroke-width="2"/>
  <text x="660" y="145" text-anchor="middle" fill="#f08468" font-family="Figtree,sans-serif" font-size="13" font-weight="600">Mouth / Head</text>
  <text x="660" y="165" text-anchor="middle" fill="#9bb0c4" font-family="Figtree,sans-serif" font-size="11">DC motor</text>
  <rect x="580" y="220" width="160" height="80" rx="8" fill="#143552" stroke="#f08468" stroke-width="2"/>
  <text x="660" y="265" text-anchor="middle" fill="#f08468" font-family="Figtree,sans-serif" font-size="13" font-weight="600">Tail</text>
  <text x="660" y="285" text-anchor="middle" fill="#9bb0c4" font-family="Figtree,sans-serif" font-size="11">DC motor</text>
  <path d="M225 150 H335" stroke="#e76f51" stroke-width="2"/>
  <path d="M225 180 H335" stroke="#e76f51" stroke-width="2"/>
  <path d="M225 220 H335" stroke="#f08468" stroke-width="2"/>
  <path d="M225 250 H335" stroke="#f08468" stroke-width="2"/>
  <path d="M225 290 H335" stroke="#888" stroke-width="2"/>
  <path d="M505 150 H580" stroke="#e76f51" stroke-width="2"/>
  <path d="M505 180 H560 V160 H580" stroke="#e76f51" stroke-width="2" fill="none"/>
  <path d="M505 220 H580" stroke="#f08468" stroke-width="2"/>
  <path d="M505 250 H560 V280 H580" stroke="#f08468" stroke-width="2" fill="none"/>
  <text x="390" y="40" text-anchor="middle" fill="#9bb0c4" font-family="Figtree,sans-serif" font-size="12">ENA &amp; ENB jumpers ON · share GND with ESP32</text>
</svg>
