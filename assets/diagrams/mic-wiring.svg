<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
  <title>INMP441 to ESP32-S3 wiring</title>
  <rect width="720" height="320" fill="#0c2138" rx="4"/>
  <!-- Mic module -->
  <rect x="50" y="70" width="160" height="200" rx="8" fill="#143552" stroke="#3dbeb0" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" fill="#a8e6df" font-family="Figtree,sans-serif" font-size="15" font-weight="700">INMP441</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#eef4f8">
    <circle cx="190" cy="130" r="5" fill="#e8dcc8"/><text x="70" y="134">VDD</text>
    <circle cx="190" cy="155" r="5" fill="#666"/><text x="70" y="159">GND</text>
    <circle cx="190" cy="180" r="5" fill="#3dbeb0"/><text x="70" y="184">SD</text>
    <circle cx="190" cy="205" r="5" fill="#3dbeb0"/><text x="70" y="209">WS</text>
    <circle cx="190" cy="230" r="5" fill="#3dbeb0"/><text x="70" y="234">SCK</text>
    <circle cx="190" cy="255" r="5" fill="#666"/><text x="70" y="259">L/R</text>
  </g>
  <!-- ESP32 -->
  <rect x="480" y="40" width="190" height="240" rx="8" fill="#143552" stroke="#e8dcc8" stroke-width="2"/>
  <text x="575" y="70" text-anchor="middle" fill="#eef4f8" font-family="Bricolage Grotesque,sans-serif" font-size="16" font-weight="700">ESP32-S3</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#eef4f8">
    <circle cx="500" cy="130" r="5" fill="#e8dcc8"/><text x="515" y="134">3V3</text>
    <circle cx="500" cy="155" r="5" fill="#666"/><text x="515" y="159">GND</text>
    <circle cx="500" cy="180" r="5" fill="#3dbeb0"/><text x="515" y="184">GPIO8</text>
    <circle cx="500" cy="205" r="5" fill="#3dbeb0"/><text x="515" y="209">GPIO9</text>
    <circle cx="500" cy="230" r="5" fill="#3dbeb0"/><text x="515" y="234">GPIO10</text>
    <circle cx="500" cy="255" r="5" fill="#666"/><text x="515" y="259">GND</text>
  </g>
  <!-- Wires -->
  <path d="M195 130 H470" stroke="#e8dcc8" stroke-width="2" fill="none"/>
  <path d="M195 155 H470" stroke="#888" stroke-width="2" fill="none"/>
  <path d="M195 180 H470" stroke="#3dbeb0" stroke-width="2" fill="none"/>
  <path d="M195 205 H470" stroke="#3dbeb0" stroke-width="2" fill="none"/>
  <path d="M195 230 H470" stroke="#3dbeb0" stroke-width="2" fill="none"/>
  <path d="M195 255 H350 V155" stroke="#888" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
  <text x="360" y="40" text-anchor="middle" fill="#9bb0c4" font-family="Figtree,sans-serif" font-size="12">L/R tied to GND (left channel)</text>
</svg>
