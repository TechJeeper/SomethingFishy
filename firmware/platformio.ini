; PlatformIO — SomethingFishy ESP32-S3 firmware
[env:esp32-s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
  -D CORE_DEBUG_LEVEL=1
  ; 0 = Serial on UART0 (CH343/CP210x USB-UART, typical COM port).
  ; Set to 1 only if you flash/monitor over the ESP32-S3 native USB port.
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -I include
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
; Keep diagnostic sketches out of the production image (they define setup/loop too).
build_src_filter =
  +<*>
  -<tts_hello_test.cpp>
  -<i2s_sweep_test.cpp>

; Speaker-only smoke test: OpenAI TTS says "Hello World" on boot (and on serial 't').
; Keeps billycfg partition — flash with: pio run -e speaker-tts-test -t upload --upload-port COMx
[env:speaker-tts-test]
extends = env:esp32-s3
build_src_filter =
  +<audio.cpp>
  +<config_store.cpp>
  +<openai_client.cpp>
  +<tts_hello_test.cpp>

; I2S wiring/format diagnostic: plays a 440 Hz tone under each candidate pin
; mapping so a clean one can be identified by ear. No Wi-Fi or config needed.
[env:speaker-pin-sweep]
extends = env:esp32-s3
build_src_filter =
  +<i2s_sweep_test.cpp>
