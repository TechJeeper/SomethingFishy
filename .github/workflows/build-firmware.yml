name: Build Firmware

on:
  push:
    branches: [main, master]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build
        working-directory: firmware
        run: pio run -e esp32-s3

      - name: Stage binaries
        run: |
          mkdir -p firmware-bin
          BUILD=firmware/.pio/build/esp32-s3
          cp "$BUILD/firmware.bin" firmware-bin/
          cp "$BUILD/bootloader.bin" firmware-bin/
          cp "$BUILD/partitions.bin" firmware-bin/
          BOOT_APP=$(find "$HOME/.platformio" -name boot_app0.bin 2>/dev/null | head -n 1)
          if [ -n "$BOOT_APP" ]; then cp "$BOOT_APP" firmware-bin/boot_app0.bin; fi
          ls -la firmware-bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: somethingfishy-firmware
          path: firmware-bin/*
